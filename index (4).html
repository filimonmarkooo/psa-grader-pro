<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA Grader Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e1a; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header p { color: rgba(255,255,255,0.7); }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .card { background: rgba(30,40,70,0.8); border: 1px solid rgba(100,150,255,0.3); border-radius: 15px; padding: 2rem; }
        .card h2 { margin-bottom: 1rem; font-size: 1.5rem; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .photo-slot { background: rgba(10,20,40,0.8); border: 2px dashed rgba(100,150,255,0.5); border-radius: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; text-align: center; padding: 1rem; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .photo-slot input { display: none; }
        .photo-slot.filled { border-color: rgba(0,255,0,0.5); }
        .photo-checkmark { position: absolute; top: 10px; right: 10px; background: #00ff00; color: black; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 10; }
        .btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,130,246,0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .api-prompt { max-width: 500px; margin: 10rem auto; background: rgba(30,40,70,0.9); border: 1px solid rgba(100,150,255,0.3); border-radius: 15px; padding: 2rem; text-align: center; }
        .api-prompt input { width: 100%; padding: 1rem; background: rgba(10,20,40,0.8); border: 1px solid rgba(100,150,255,0.3); border-radius: 10px; color: white; margin: 1rem 0; font-family: monospace; }
        .grade-display { font-size: 3rem; font-weight: bold; text-align: center; color: #00ff00; margin: 2rem 0; }
        .confidence { text-align: center; color: rgba(255,255,255,0.8); margin-bottom: 1rem; }
        .loading { text-align: center; color: rgba(255,255,255,0.7); }
        .error { background: rgba(255,0,0,0.2); border: 1px solid rgba(255,0,0,0.5); border-radius: 10px; padding: 1rem; color: #ff6b6b; margin-top: 1rem; }
        .section-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 PSA Grader Pro</h1>
            <p>AI-powered card grading</p>
        </div>
        <div id="app"></div>
    </div>

    <script>
        const API_KEY_STORAGE = 'psa_grader_api_key';
        
        class PSAGrader {
            constructor() {
                this.apiKey = localStorage.getItem(API_KEY_STORAGE) || '';
                this.photos = { front: null, front45: null, back: null, back45: null };
                this.isAnalyzing = false;
                this.render();
            }

            setApiKey(key) {
                this.apiKey = key;
                if (key) {
                    localStorage.setItem(API_KEY_STORAGE, key);
                }
                this.render();
            }

            compressImage(dataUrl, quality = 0.7, maxWidth = 1200) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressed = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressed);
                    };
                    img.src = dataUrl;
                });
            }

            async setPhoto(position, file) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const compressed = await this.compressImage(e.target.result, 0.6, 1024);
                    this.photos[position] = compressed;
                    this.render();
                };
                reader.readAsDataURL(file);
            }

            async analyzePhotos() {
                if (!this.apiKey) {
                    alert('Please enter API key first');
                    return;
                }

                if (!this.photos.front || !this.photos.front45 || !this.photos.back || !this.photos.back45) {
                    alert('Please upload all 4 photos');
                    return;
                }

                this.isAnalyzing = true;
                this.render();

                try {
                    const extractBase64 = (dataUrl) => {
                        if (dataUrl.includes(',')) {
                            return dataUrl.split(',')[1];
                        }
                        return dataUrl;
                    };

                    const response = await fetch('/api/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': this.apiKey
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1500,
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'text',
                                        text: `You are a PSA card grading expert. Analyze these 4 trading card photos and provide a grade prediction (PSA 1-10).

Photo 1: Front (straight)
Photo 2: Front (45° angle)
Photo 3: Back (straight)
Photo 4: Back (45° angle)

Analyze centering, corners, edges, and surface condition. 

PSA 10 = Perfect (4 sharp corners, full gloss, no flaws)
PSA 9 = Mint (slight flaw only)
PSA 8 = NM-MT (minor wear)
PSA 7 = NM (slight surface wear)

Respond with ONLY this JSON format:
{"grade": 9, "confidence": 92, "analysis": "Brief analysis", "recommendation": "Submit"}`
                                    },
                                    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: extractBase64(this.photos.front) } },
                                    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: extractBase64(this.photos.front45) } },
                                    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: extractBase64(this.photos.back) } },
                                    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: extractBase64(this.photos.back45) } }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('API Response:', response.status, errorText);
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();
                    const content = data.content[0].text;
                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) {
                        throw new Error('Could not parse response');
                    }
                    const result = JSON.parse(jsonMatch[0]);
                    this.result = result;
                } catch (error) {
                    this.error = error.message;
                    console.error('Analysis error:', error);
                }

                this.isAnalyzing = false;
                this.render();
            }

            render() {
                const app = document.getElementById('app');
                
                if (!this.apiKey) {
                    app.innerHTML = `
                        <div class="api-prompt">
                            <h2>Enter API Key</h2>
                            <p style="color: rgba(255,255,255,0.7); margin: 1rem 0;">Get at <a href="https://console.anthropic.com" target="_blank" style="color: #3b82f6;">console.anthropic.com</a></p>
                            <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
                            <button class="btn" onclick="grader.setApiKey(document.getElementById('apiKeyInput').value)">Start</button>
                        </div>
                    `;
                    return;
                }

                let photoCount = Object.values(this.photos).filter(p => p).length;

                app.innerHTML = `
                    <div class="main-grid">
                        <div class="card">
                            <h2>📸 Upload Photos</h2>
                            <div class="photo-grid">
                                ${this.renderPhotoSlot('front', 'Front')}
                                ${this.renderPhotoSlot('front45', 'Front 45°')}
                                ${this.renderPhotoSlot('back', 'Back')}
                                ${this.renderPhotoSlot('back45', 'Back 45°')}
                            </div>
                            <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Uploaded: ${photoCount}/4</p>
                            <button class="btn" onclick="grader.analyzePhotos()" ${this.isAnalyzing ? 'disabled' : ''}>
                                ${this.isAnalyzing ? '🔄 Analyzing...' : '🔬 Analyze'}
                            </button>
                        </div>

                        <div class="card">
                            <h2>📊 Results</h2>
                            ${this.isAnalyzing ? `<div class="loading">Analyzing with Claude Vision...</div>` : ''}
                            ${this.error ? `<div class="error">${this.error}</div>` : ''}
                            ${this.result ? `
                                <div class="grade-display">PSA ${this.result.grade}</div>
                                <div class="confidence">Confidence: ${this.result.confidence}%</div>
                                <div class="section-title">Analysis</div>
                                <p style="color: rgba(255,255,255,0.8);">${this.result.analysis}</p>
                                <div class="section-title">Recommendation</div>
                                <p style="color: rgba(255,255,255,0.8);">${this.result.recommendation}</p>
                            ` : '<p style="color: rgba(255,255,255,0.5);">Upload 4 photos and click Analyze</p>'}
                        </div>
                    </div>
                `;

                document.querySelectorAll('.photo-slot input').forEach(input => {
                    input.addEventListener('change', async (e) => {
                        const position = e.target.dataset.position;
                        if (e.target.files[0]) {
                            await grader.setPhoto(position, e.target.files[0]);
                        }
                    });
                });
            }

            renderPhotoSlot(position, label) {
                const hasPhoto = !!this.photos[position];
                return `
                    <div class="photo-slot ${hasPhoto ? 'filled' : ''}" onclick="document.getElementById('photo-${position}').click()">
                        ${hasPhoto ? `<img src="${this.photos[position]}" />` : ''}
                        ${hasPhoto ? '<div class="photo-checkmark">✓</div>' : `<div>${label}</div>`}
                        <input type="file" id="photo-${position}" data-position="${position}" accept="image/*" />
                    </div>
                `;
            }
        }

        const grader = new PSAGrader();
    </script>
</body>
</html>
