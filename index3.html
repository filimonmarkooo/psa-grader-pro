<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ===== CALIBRATION STORAGE =====
        class CalibrationSystem {
            constructor() {
                this.storageKey = 'psa_grader_calibration';
            }

            getHistory() {
                const data = localStorage.getItem(this.storageKey);
                return data ? JSON.parse(data) : [];
            }

            logSubmission(predicted, actual, cardName = '') {
                const history = this.getHistory();
                history.push({
                    date: new Date().toISOString(),
                    predicted: parseInt(predicted),
                    actual: parseInt(actual),
                    cardName: cardName,
                    timestamp: Date.now()
                });
                localStorage.setItem(this.storageKey, JSON.stringify(history));
                return this.getStats();
            }

            getStats() {
                const history = this.getHistory();
                if (history.length === 0) {
                    return { total: 0, exactMatches: 0, withinOne: 0, accuracy: 0 };
                }

                const exactMatches = history.filter(h => h.predicted === h.actual).length;
                const withinOne = history.filter(h => Math.abs(h.predicted - h.actual) <= 1).length;
                
                return {
                    total: history.length,
                    exactMatches,
                    withinOne,
                    accuracy: Math.round((withinOne / history.length) * 100)
                };
            }

            clearHistory() {
                localStorage.removeItem(this.storageKey);
            }
        }

        // ===== CENTERING CALCULATOR =====
        class CenteringCalculator {
            async calculateCentering(imageDataUrl) {
                // This will detect edges and calculate precise centering ratios
                // Returns { front: "62/38", back: "71/29", measurements: {...} }
                const img = await this.loadImage(imageDataUrl);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                // Get image data for edge detection
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const edges = this.detectCardEdges(imageData);

                return {
                    ratio: this.calculateRatio(edges),
                    measurements: edges
                };
            }

            detectCardEdges(imageData) {
                // Simplified edge detection - finds the card boundaries
                const { width, height, data } = imageData;
                
                // Find left edge
                let left = 0;
                for (let x = 0; x < width; x++) {
                    let edgeFound = false;
                    for (let y = Math.floor(height * 0.3); y < Math.floor(height * 0.7); y++) {
                        const idx = (y * width + x) * 4;
                        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (brightness > 50) {
                            left = x;
                            edgeFound = true;
                            break;
                        }
                    }
                    if (edgeFound) break;
                }

                // Find right edge
                let right = width;
                for (let x = width - 1; x >= 0; x--) {
                    let edgeFound = false;
                    for (let y = Math.floor(height * 0.3); y < Math.floor(height * 0.7); y++) {
                        const idx = (y * width + x) * 4;
                        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (brightness > 50) {
                            right = x;
                            edgeFound = true;
                            break;
                        }
                    }
                    if (edgeFound) break;
                }

                // Find top edge
                let top = 0;
                for (let y = 0; y < height; y++) {
                    let edgeFound = false;
                    for (let x = Math.floor(width * 0.3); x < Math.floor(width * 0.7); x++) {
                        const idx = (y * width + x) * 4;
                        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (brightness > 50) {
                            top = y;
                            edgeFound = true;
                            break;
                        }
                    }
                    if (edgeFound) break;
                }

                // Find bottom edge
                let bottom = height;
                for (let y = height - 1; y >= 0; y--) {
                    let edgeFound = false;
                    for (let x = Math.floor(width * 0.3); x < Math.floor(width * 0.7); x++) {
                        const idx = (y * width + x) * 4;
                        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (brightness > 50) {
                            bottom = y;
                            edgeFound = true;
                            break;
                        }
                    }
                    if (edgeFound) break;
                }

                return { left, right, top, bottom, width, height };
            }

            calculateRatio(edges) {
                const { left, right, top, bottom, width, height } = edges;
                
                // Calculate horizontal centering
                const leftBorder = left;
                const rightBorder = width - right;
                const totalHorizontal = leftBorder + rightBorder;
                const leftPercent = Math.round((leftBorder / totalHorizontal) * 100);
                const rightPercent = 100 - leftPercent;

                // Calculate vertical centering
                const topBorder = top;
                const bottomBorder = height - bottom;
                const totalVertical = topBorder + bottomBorder;
                const topPercent = Math.round((topBorder / totalVertical) * 100);
                const bottomPercent = 100 - topPercent;

                return {
                    horizontal: `${Math.max(leftPercent, rightPercent)}/${Math.min(leftPercent, rightPercent)}`,
                    vertical: `${Math.max(topPercent, bottomPercent)}/${Math.min(topPercent, bottomPercent)}`,
                    leftPercent,
                    rightPercent,
                    topPercent,
                    bottomPercent
                };
            }

            loadImage(dataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = dataUrl;
                });
            }
        }

        // ===== IMAGE ENHANCEMENT ENGINE =====
        class ImageEnhancer {
            async enhanceImage(imageDataUrl) {
                const img = await this.loadImage(imageDataUrl);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;

                const enhancements = [];

                // Original
                ctx.drawImage(img, 0, 0);
                enhancements.push(canvas.toDataURL('image/jpeg', 0.92));

                // High Contrast
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.filter = 'contrast(160%)';
                ctx.drawImage(img, 0, 0);
                ctx.filter = 'none';
                enhancements.push(canvas.toDataURL('image/jpeg', 0.92));

                // Shadow Enhanced
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.filter = 'brightness(70%) contrast(150%)';
                ctx.drawImage(img, 0, 0);
                ctx.filter = 'none';
                enhancements.push(canvas.toDataURL('image/jpeg', 0.92));

                // Saturation Boost
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.filter = 'saturate(200%)';
                ctx.drawImage(img, 0, 0);
                ctx.filter = 'none';
                enhancements.push(canvas.toDataURL('image/jpeg', 0.92));

                // Inverted
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.filter = 'invert(100%)';
                ctx.drawImage(img, 0, 0);
                ctx.filter = 'none';
                enhancements.push(canvas.toDataURL('image/jpeg', 0.92));

                return enhancements;
            }

            loadImage(dataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = dataUrl;
                });
            }

            dataUrlToBase64(dataUrl) {
                return dataUrl.split(',')[1];
            }
        }

                setCalibrationHistory(calibration.getHistory());
                setActualGrade('');
                setCardName('');

                setAnalyzing(true);

                setResults(null);

                    const centeringCalc = new CenteringCalculator();
                    
                    setLoadingStep('Calculating pixel-perfect centering...');
                    const frontCentering = await centeringCalc.calculateCentering(photos.frontStraight);
                    const backCentering = await centeringCalc.calculateCentering(photos.backStraight);
                    
                    setCenteringData({
                        front: {
                            image: photos.frontStraight,
                            ...frontCentering
                        },
                        back: {
                            image: photos.backStraight,
                            ...backCentering
                        }
                    });
                    
                    setLoadingStep('Enhancing front images (5 passes per photo)...');
                    const frontEnhancements = await enhancer.enhanceImage(photos.frontStraight);
                    const front45Enhancements = await enhancer.enhanceImage(photos.front45);
                    
                    setLoadingStep('Enhancing back images (5 passes per photo)...');
                    const backEnhancements = await enhancer.enhanceImage(photos.backStraight);
                    const back45Enhancements = await enhancer.enhanceImage(photos.back45);

                    setLoadingStep('Preparing images for Claude Vision API...');
                    
                    // Prepare images for API
                    const imagesToAnalyze = [
                        frontEnhancements[0], // Original front
                        front45Enhancements[1], // High contrast
                        front45Enhancements[2], // Shadow enhanced
                        backEnhancements[0], // Original back
                        back45Enhancements[1], // High contrast
                        back45Enhancements[3], // Saturation boost
                        back45Enhancements[4], // Inverted
                    ];

                    const imageContent = imagesToAnalyze.map(dataUrl => ({
                        type: 'image',
                        source: {
                            type: 'base64',
                            media_type: 'image/jpeg',
                            data: enhancer.dataUrlToBase64(dataUrl)
                        }
                    }));

                    setLoadingStep('Calling Claude Vision API for analysis...');

                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01'
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 4000,
                            system: buildSystemPrompt(),
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'text',
                                        text: 'Analyze these trading card photos using PSA grading standards. Images: 1) Front original, 2) Front high contrast, 3) Front shadow enhanced, 4) Back original, 5) Back high contrast, 6) Back saturation boost, 7) Back inverted. Return analysis as JSON.'
                                    },
                                    ...imageContent
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `API Error: ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    setLoadingStep('Parsing results...');
                    
                    // Extract JSON from Claude's response
                    const responseText = data.content[0].text;
                    const jsonMatch = responseText.match(/\{[\s\S]*\}/);
                    
                    if (!jsonMatch) {
                        throw new Error('Could not parse response from Claude');
                    }
                    
                    const analysisResults = JSON.parse(jsonMatch[0]);
                    setResults(analysisResults);

                    console.error('Analysis error:', err);
                    setError(err.message || 'An error occurred during analysis');

                    setLoadingStep('');

                        <div className="calibration-history">
                            <div className="history-title">Recent Submissions</div>
                            <div className="history-list">
                                {[...history].reverse().slice(0, 10).map((item, i) => {
                                    const diff = Math.abs(item.predicted - item.actual);
                                    const accuracyClass = diff === 0 ? 'perfect' : diff === 1 ? 'close' : 'off';
                                    const accuracyText = diff === 0 ? 'Perfect' : diff === 1 ? '±1' : `±${diff}`;
                                    
                                    return (
                                        <div key={i} className="history-item">
                                            <div className="history-date">
                                                {new Date(item.date).toLocaleDateString()}
                                            </div>
                                            <div className="history-card">
                                                {item.cardName || 'Untitled Card'}
                                            </div>
                                            <div className="history-grades">
                                                <span className="history-predicted">Predicted: {item.predicted}</span>
                                                <span>→</span>
                                                <span className="history-actual">Actual: {item.actual}</span>
                                            </div>
                                            <div className={`history-accuracy ${accuracyClass}`}>
                                                {accuracyText}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ===== PSA GRADING PROMPT =====
        function buildSystemPrompt() {
            return `You are an expert PSA card grader. Analyze cards with pixel-perfect accuracy using these standards:

PSA 10 (GEM MINT): 4 sharp corners, full gloss, no staining. Front: 55/45-60/40. Back: 75/25+.
PSA 9 (MINT): ONE minor flaw only. Front: 60/40-65/35. Back: 90/10+.
PSA 8 (NM-MT): Slight wax stain/fraying/printing defect. Front: 65/35-70/30. Back: 90/10+.

CRITICAL: Indents (texture/depth) = PSA 8 or worse. Dimples (circular, no depth) = can be PSA 10.

Return JSON:
{
  "grade": 1-10,
  "gradeName": "PSA X",
  "confidence": 0-100,
  "centering": {"front": "X/X", "back": "X/X", "score": "X/10", "status": "excellent|good|warning|poor"},
  "corners": {"score": "X/10", "status": "...", "details": "..."},
  "edges": {"score": "X/10", "status": "...", "details": "..."},
  "surface": {"score": "X/10", "status": "...", "details": "...", "defects": [], "limitingFactor": "..."},
  "recommendation": {"submit": true/false, "reason": "...", "rawValue": 0, "gradedValue": 0, "profit": 0}
}`;
        }

        ReactDOM.render(<PSAGraderApp />, document.getElementById('root'));
    </script>
</body>
</html>
